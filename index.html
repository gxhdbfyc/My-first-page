<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик посещений</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
            font-weight: normal;
        }
        #counter {
            font-size: 120px;
            font-weight: bold;
            text-shadow: 0 0 30px #00ff41;
            margin: 20px 0;
            transition: transform 0.2s;
        }
        #counter.pulse {
            transform: scale(1.05);
        }
        .button {
            margin-top: 40px;
            padding: 14px 36px;
            background: #00ff41;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
            font-family: 'Courier New', monospace;
            border: 2px solid #00ff41;
        }
        .button:hover {
            background: #ff5722;
            border-color: #ff5722;
            color: #fff;
            box-shadow: 0 0 20px #ff5722;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            color: #333;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>СЧЁТЧИК ПОСЕЩЕНИЙ</h1>
    <div id="counter">1000</div>
    <a href="http://canarytokens.com/stuff/about/articles/kiz72fblugnm8alz79pdflr1k/post.jsp" class="button" target="_blank">Исходный код</a>
    <div class="footer">D0ZENSAD</div>

    <script>
        // ============ ГЛОБАЛЬНЫЙ СЧЁТЧИК ЧЕРЕЗ COUNTAPI ============
        const counterEl = document.getElementById('counter');
        const key = 'd0zensad_visits_counter'; // УНИКАЛЬНЫЙ КЛЮЧ (МОЖЕШЬ ИЗМЕНИТЬ)

        // ФУНКЦИЯ ДЛЯ ОБНОВЛЕНИЯ СЧЁТЧИКА
        async function updateCounter() {
            try {
                // ПРОБУЕМ ПОЛУЧИТЬ ТЕКУЩЕЕ ЗНАЧЕНИЕ
                let res = await fetch(`https://api.countapi.xyz/get/${key}/visits`);
                let data = await res.json();

                if (data.value === null) {
                    // ЕСЛИ СЧЁТЧИКА НЕТ — СОЗДАЁМ С 1000
                    await fetch(`https://api.countapi.xyz/create?namespace=${key}&key=visits&value=1000`);
                    res = await fetch(`https://api.countapi.xyz/hit/${key}/visits`);
                    data = await res.json();
                } else {
                    // ЕСЛИ ЕСТЬ — УВЕЛИЧИВАЕМ НА 1
                    res = await fetch(`https://api.countapi.xyz/hit/${key}/visits`);
                    data = await res.json();
                }

                // ОБНОВЛЯЕМ ЧИСЛО
                counterEl.textContent = data.value;

                // АНИМАЦИЯ ПУЛЬСАЦИИ
                counterEl.classList.add('pulse');
                setTimeout(() => counterEl.classList.remove('pulse'), 200);

            } catch (e) {
                // ЕСЛИ ОШИБКА — ПОКАЗЫВАЕМ 1000
                counterEl.textContent = '1000';
                console.error('Ошибка счётчика:', e);
            }
        }

        // ЗАПУСКАЕМ ПРИ ЗАГРУЗКЕ
        updateCounter();
    </script>
</body>
</html>
